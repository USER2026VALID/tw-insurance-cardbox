            <p id="dataset-summary" class="text-xs text-slate-400 font-mono">正在載入最新資料…</p>
          </div>
        </div>

        <!-- Right Quick Controls -->
        <div class="flex items-center gap-2 sm:gap-3">
          <button id="btn-toggle-favorite-filter" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition">
            <svg id="header-fav-icon" class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>

      </div>

  <!-- Filter & Search Panel -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
      <div class="flex flex-col gap-3">
        <!-- Search and Quick Stats Bar -->
        <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
          <div class="relative flex-1 max-w-xl">
            <input type="text" id="search-input" placeholder="搜尋商品名稱、代碼 (如 NCIC, HMRA)、或保障關鍵字..." class="w-full pl-9 pr-9 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <button id="clear-search-btn" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="flex items-center gap-2 text-xs text-slate-600 flex-wrap">
            <span class="font-medium text-slate-500">符合條件：</span>
            <span id="filtered-count" class="font-bold text-blue-600 text-sm">0</span>
            <span class="text-slate-400">/ <span id="total-count">0</span> 檔商品</span>
            <span class="text-slate-300">|</span>
            <button id="reset-all-filters-btn" class="text-blue-600 hover:text-blue-800 underline text-xs font-medium">重設所有篩選</button>
          </div>
        </div>

        <!-- Filter Dimension 1: Company Filter Pills -->
        <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1 text-xs">
          <span class="text-slate-400 font-medium whitespace-nowrap pl-0.5">公司：</span>
          <div id="company-pills" class="flex items-center gap-1.5 flex-nowrap">
            <!-- Dynamic Company Pills will be injected here -->
          </div>
        </div>

        <!-- Filter Dimension 2: Categories, Contract Type & Age Slider -->
        <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1 text-xs">
          <span class="text-slate-400 font-medium whitespace-nowrap pl-0.5">險種：</span>
          <div id="category-pills" class="flex items-center gap-1.5 flex-nowrap">
            <!-- Dynamic Category Pills will be injected here -->
          </div>
        </div>

        <!-- Filter Dimension 3: Advanced toggles (Contract type, Age limit, 2-2-7) -->
        <div class="flex items-center justify-between flex-wrap gap-2 pt-1 border-t border-slate-100 text-xs">
          <div class="flex items-center gap-3 flex-wrap">
            <div class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md">
              <span class="text-slate-500">主附約:</span>
              <button data-type="all" class="type-filter-btn px-2 py-0.5 rounded text-xs font-medium bg-white text-blue-600 shadow-xs">全部</button>
              <button data-type="主約" class="type-filter-btn px-2 py-0.5 rounded text-xs font-medium text-slate-600 hover:text-slate-900">主約</button>
              <button data-type="附約" class="type-filter-btn px-2 py-0.5 rounded text-xs font-medium text-slate-600 hover:text-slate-900">附約</button>
            </div>

            <label class="flex items-center gap-1.5 cursor-pointer text-slate-700 hover:text-slate-900">

            <span class="text-slate-500">投保年齡試算：</span>

          </div>
        </div>

      <div class="flex items-center gap-1.5">

        <span id="active-tag-name" class="px-2 py-0.5 bg-blue-600 text-white rounded font-medium"></span>
      </div>
      <button id="clear-active-tag-btn" class="text-blue-600 hover:text-blue-900 underline font-medium">清除標籤</button>
    </div>

    <!-- Cards Container -->
    <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Cards will be populated here via JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden py-16 text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">

      <button id="btn-empty-reset" class="mt-4 px-4 py-2 text-xs bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">重設所有條件</button>

      const discoveredCategories = [...new Set(insuranceProducts.flatMap(p => p.categories || []))];
      const categories = ["全部", ...preferredCategories.filter(c => discoveredCategories.includes(c)), ...discoveredCategories.filter(c => !preferredCategories.includes(c))];
      categoryPillsContainer.innerHTML = categories.map(cat => `
        <button data-category="${cat}" class="category-pill px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap ${cat === '全部' ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">

            if (b.dataset.company === state.selectedCompany) {
              b.className = "company-pill px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap bg-slate-800 text-white shadow-xs";
            } else {

          });

        });

        btn.addEventListener("click", () => {

          categoryPillsContainer.querySelectorAll(".category-pill").forEach(b => {

          renderCards();
        });
      });

    // Filter Logic
    function getFilteredProducts() {
      return insuranceProducts.filter(p => {
        // 1. Search Query
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          const matchName = p.product_full_name.toLowerCase().includes(q);
          const matchCode = (p.product_code || "").toLowerCase().includes(q);
          const matchChips = p.feature_chips.some(c => c.toLowerCase().includes(q));
          if (!matchName && !matchCode && !matchChips) return false;
        }

        // 2. Company
        if (state.selectedCompany !== "全部" && p.company !== state.selectedCompany) {
          return false;
        }

        // 3. Category
        if (state.selectedCategory !== "全部") {
          if (!p.categories.includes(state.selectedCategory) && !p.feature_chips.includes(state.selectedCategory)) {
            return false;
          }
        }

        // 4. Contract Type
        if (state.selectedContractType !== "all" && p.contract_type !== state.selectedContractType) {
          return false;
        }

        // 5. Guaranteed Renewal
        if (state.guaranteedRenewalOnly && !p.is_guaranteed_renewal) {
          return false;
        }

        // 6. No 2-2-7 Restriction
        if (state.no227Only && p.has_227_restriction) {
          return false;
        }

        // 7. Only New Arrivals
        if (state.onlyNewArrivals && !p.is_new) {
          return false;
        }

        // 8. Only Favorites
        if (state.onlyFavorites && !state.favorites.has(p.id)) {
          return false;
        }

        // 9. Age Eligibility Filter
        if (state.ageFilter !== null && !isNaN(state.ageFilter)) {
          if (state.ageFilter < p.min_issue_age || state.ageFilter > p.max_issue_age) {
            return false;
          }
        }

        // 10. Selected Tag from Chip click
        if (state.selectedTag && !p.feature_chips.includes(state.selectedTag)) {
          return false;
        }

        return true;
      });
    }

    // Render Cards in Gallery Grid (Zettelkasten style matching screenshot)

        activeTagIndicator.classList.remove("hidden");

        activeTagIndicator.classList.add("hidden");

      if (list.length === 0) {
        cardsGrid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      cardsGrid.innerHTML = list.map(item => {
        const isFav = state.favorites.has(item.id);
        const heartSvg = isFav
          ? `<svg class="w-4 h-4 text-rose-500 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
          : `<svg class="w-4 h-4 text-slate-400 hover:text-rose-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>`;

        // Card Chips
        const chipsHtml = item.feature_chips.map(chip => `

        // Status tag (e.g. 新 10-09)

          ? `<span class="text-[11px] font-medium px-1.5 py-0.2 rounded ${item.is_new ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}">${item.new_tag}</span>`
          : "";

        const typeBadge = `<span class="text-[11px] font-medium px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 border border-slate-200">${item.contract_type}</span>`;

        return `
          <div data-id="${item.id}" class="product-card group bg-white rounded-lg border border-slate-200 shadow-xs hover:shadow-md transition-all duration-200 flex flex-col justify-between p-3.5 cursor-pointer relative hover:border-blue-400">

                    ${item.release_month}
                  </span>
                </div>

                ${item.product_full_name}

              <!-- Status & Type Badges -->
              <div class="flex items-center gap-1.5 mb-2 flex-wrap">
                ${newTagBadge}
                ${typeBadge}
              </div>

              <!-- Feature Chips (Zettelkasten tags) -->

                ${chipsHtml}

          if (e.target.closest(".fav-btn") || e.target.closest(".card-chip-btn")) return;
          const pid = card.dataset.id;
          const product = insuranceProducts.find(p => p.id === pid);

      // Attach Favorite Button Listeners
      cardsGrid.querySelectorAll(".fav-btn").forEach(btn => {

      cardsGrid.querySelectorAll(".card-chip-btn").forEach(btn => {

      drawerProductCode.textContent = p.product_code || "無代碼";
      drawerStatusBadge.className = p.sales_status === "現售"
        ? "px-2 py-0.5 rounded text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-400/30"
        : "px-2 py-0.5 rounded text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-400/30";
      drawerStatusBadge.textContent = p.sales_status;
      drawerProductTitle.textContent = p.product_full_name;
      drawerApprovalNo.textContent = "核准文號：" + p.approval_number;

      drawerContractType.textContent = p.contract_type;
      drawerAgeRange.textContent = p.age_range_display;
      drawerGuaranteed.textContent = p.is_guaranteed_renewal ? "是 (保證續保)" : "否";
      drawerRestriction.textContent = p.has_227_restriction ? "限制 2-2-7 手術" : "無限制 (廣義手術)";

      // Age table
      drawerAgeTable.innerHTML = p.age_rules.map(r => `
        <div class="flex items-center justify-between py-1 border-b border-slate-100 last:border-none">
          <span class="font-medium text-slate-700">${r.term}</span>
          <span class="font-mono text-slate-600">最高投保年齡：${r.max_age} 歲</span>
        </div>
      `).join("");

      // Sum limits
      drawerSumLimits.innerHTML = `
        <p><strong>單位：</strong>${p.sum_assured_limits.unit}</p>
        <p><strong>投保區間：</strong>${p.sum_assured_limits.min} ～ ${p.sum_assured_limits.max}</p>
        <p class="text-slate-500 mt-1"><strong>核保限制說明：</strong>${p.sum_assured_limits.notes}</p>
      `;

      // Coverage list
      drawerCoverageList.innerHTML = p.coverage_highlights.map(c => `
        <div class="p-3 bg-white border border-slate-200 rounded-lg shadow-xs">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-slate-800 text-xs">${c.name}</span>
            <div class="flex items-center gap-1.5 text-[11px]">
              <span class="px-1.5 py-0.2 bg-blue-50 text-blue-700 rounded border border-blue-200 font-mono">${c.clause}</span>
              <span class="text-slate-400">等待期 ${c.waiting_period} 天</span>
            </div>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">${c.summary}</p>
        </div>
      `).join("");

      // Evidence & Citation
      drawerEvidenceQuote.textContent = `"${p.evidence_quote}"`;
      drawerEvidencePage.textContent = `來源：條款 PDF 第 ${p.source_page} 頁（由 AI 多模態模型結構化擷取）`;

      // Show drawer
      detailDrawer.classList.remove("hidden");
    }

    // Close Detail Drawer
    function closeDrawer() {
      detailDrawer.classList.add("hidden");
      currentOpenProduct = null;
    }

    // Event Listeners
    closeDrawerBtn.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    // Search Input
    searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value.trim();
      if (state.searchQuery) {
        clearSearchBtn.classList.remove("hidden");
      } else {
        clearSearchBtn.classList.add("hidden");
      }
      renderCards();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      state.searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      renderCards();
    });

    // Reset Filters
    function resetAllFilters() {
      state.searchQuery = "";
      state.selectedCompany = "全部";
      state.selectedCategory = "全部";
      state.selectedContractType = "all";
      state.guaranteedRenewalOnly = false;
      state.no227Only = false;
      state.onlyNewArrivals = false;
      state.onlyFavorites = false;
      state.ageFilter = null;
      state.selectedTag = null;

      searchInput.value = "";
      clearSearchBtn.classList.add("hidden");
      filterGuaranteedRenewal.checked = false;
      filterNo227.checked = false;
      filterAgeInput.value = "";

      document.querySelectorAll(".type-filter-btn").forEach(b => {
        if (b.dataset.type === "all") {
          b.className = "type-filter-btn px-2 py-0.5 rounded text-xs font-medium bg-white text-blue-600 shadow-xs";
        } else {
          b.className = "type-filter-btn px-2 py-0.5 rounded text-xs font-medium text-slate-600 hover:text-slate-900";
        }
      });

      btnNewArrivals.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-600 hover:bg-rose-500 text-white shadow transition";
      btnToggleFavoriteFilter.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition";

      initFilterPills();
      renderCards();
      showToast("已重設所有篩選條件");
    }

    resetAllFiltersBtn.addEventListener("click", resetAllFilters);
    btnEmptyReset.addEventListener("click", resetAllFilters);
    clearActiveTagBtn.addEventListener("click", () => {
      state.selectedTag = null;
      renderCards();
    });

    // Contract Type buttons
    document.querySelectorAll(".type-filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.selectedContractType = btn.dataset.type;
        document.querySelectorAll(".type-filter-btn").forEach(b => {
          if (b.dataset.type === state.selectedContractType) {
            b.className = "type-filter-btn px-2 py-0.5 rounded text-xs font-medium bg-white text-blue-600 shadow-xs";
          } else {
            b.className = "type-filter-btn px-2 py-0.5 rounded text-xs font-medium text-slate-600 hover:text-slate-900";
          }
        });
        renderCards();
      });
    });

    // Checkbox Filters
    filterGuaranteedRenewal.addEventListener("change", (e) => {
      state.guaranteedRenewalOnly = e.target.checked;
      renderCards();
    });

    filterNo227.addEventListener("change", (e) => {
      state.no227Only = e.target.checked;
      renderCards();
    });

    // Age Input
    filterAgeInput.addEventListener("input", (e) => {
      const val = parseInt(e.target.value, 10);
      state.ageFilter = isNaN(val) ? null : val;
      renderCards();
    });

    // Favorite Quick Filter
    btnToggleFavoriteFilter.addEventListener("click", () => {
      state.onlyFavorites = !state.onlyFavorites;
      if (state.onlyFavorites) {
        btnToggleFavoriteFilter.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-rose-500 bg-rose-950/60 text-rose-300 transition";
        showToast("已篩選：僅看我的收藏");
      } else {
        btnToggleFavoriteFilter.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition";
      }
      renderCards();
    });

    // New Arrivals Quick Filter
    btnNewArrivals.addEventListener("click", () => {
      state.onlyNewArrivals = !state.onlyNewArrivals;
      if (state.onlyNewArrivals) {
        btnNewArrivals.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-700 text-white ring-2 ring-rose-400 shadow transition";
        showToast("已篩選：僅看10月新上架商品");
      } else {
        btnNewArrivals.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-600 hover:bg-rose-500 text-white shadow transition";
      }
      renderCards();
    });

    // Drawer Buttons
    btnCopySummary.addEventListener("click", () => {
      if (!currentOpenProduct) return;
      const text = `${currentOpenProduct.product_full_name} (${currentOpenProduct.product_code || ''})\n` +
        `投保年齡：${currentOpenProduct.age_range_display}\n` +
        `保障摘要：\n` +
        currentOpenProduct.coverage_highlights.map(c => `• ${c.name}：${c.summary}`).join("\n");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("已複製商品摘要至剪貼簿"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("已複製商品摘要至剪貼簿");
      }
    });

    btnViewPdfDemo.addEventListener("click", () => {
      if (!currentOpenProduct) return;
      if (currentOpenProduct.source_url) {
        window.open(currentOpenProduct.source_url, "_blank", "noopener,noreferrer");
      } else {
        showToast("此商品目前沒有可用的保發中心明細連結");
      }
    });

    // Initial Execution with GitHub Pages / JSON Auto-Sync
    async function loadDataAndInit() {
      let source = "內嵌示範資料";
      try {
        const dataUrl = ['data', 'products.json'].join('/');
        if (window.location.protocol.startsWith('http')) {
          const resp = await fetch(dataUrl);
          if (resp.ok) {
            const remoteData = await resp.json();
            if (Array.isArray(remoteData)) {
              insuranceProducts.length = 0;
              remoteData.forEach(item => insuranceProducts.push(item));
              source = "GitHub Actions 同步資料";
              console.log('Loaded ' + remoteData.length + ' products from data/products.json');
            }
          }
        }
      } catch (err) {
        console.warn('Unable to load synchronized products; using embedded fallback.', err);
      }
      initFilterPills();
      updateDatasetSummary(source);
      renderCards();
    }
    loadDataAndInit();
  </script>
</body>
</html>
