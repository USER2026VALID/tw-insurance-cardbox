name: TII Primary Four-Company Master Sync

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: 'TII 起始頁（完整資料庫）'
        required: true
        default: '1'
      end_page:
        description: 'TII 結束頁'
        required: true
        default: '4000'
      workers:
        description: '並行工作數（建議 2-4）'
        required: true
        default: '4'

permissions:
  contents: write

jobs:
  tii-master:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Scan TII pages with checkpoint
        run: python tii_primary_catalog.py sync --start-page "${{ inputs.start_page }}" --end-page "${{ inputs.end_page }}" --workers "${{ inputs.workers }}"
      - name: Merge TII master with official supplements
        run: |
          python -m unittest discover -v
          python merge_tii_catalog.py
          python catalog_sync.py export-metadata
      - name: Validate four-company master
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows = json.loads(Path('catalog/tii_master.json').read_text(encoding='utf-8'))
          active = json.loads(Path('catalog/catalog.json').read_text(encoding='utf-8'))
          expected = {'204', '206', '209', '220'}
          actual = {row.get('company_code') for row in rows}
          print('master records:', len(rows), 'companies:', Counter(row.get('company_name') for row in rows))
          print('active records:', len(active), 'companies:', Counter(row.get('company_name') for row in active))
          if not rows or not (actual & expected):
              raise SystemExit('TII master is empty')
          if not active:
              raise SystemExit('active catalog is empty')
          if any(row.get('sales_status') != '現售' or (row.get('discontinued_date') or '') not in ('', '未停售') for row in active):
              raise SystemExit('active catalog contains discontinued or unknown records')
          if not ({'204', '206', '209'} <= {row.get('company_code') for row in active}):
              raise SystemExit('active catalog is missing one of the three TII companies')
          PY
      - name: Commit TII master and derived catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog/tii_master.json catalog/tii_master_checkpoint.json catalog/catalog.json catalog/post_undiscontinued_candidates.json tii_insurance_data/all_products_metadata.json
          if git diff --cached --quiet; then
            echo 'No TII master changes.'
          else
            git commit -m 'chore: refresh TII primary four-company master [skip ci]'
            git push
          fi
