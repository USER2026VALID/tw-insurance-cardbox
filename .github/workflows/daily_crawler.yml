name: Daily Insurance Products Sync & Auto Deploy (Zero-API)

on:
  schedule:
    # 台灣時間每天凌晨 02:00（UTC 18:00）自動執行
    - cron: '0 18 * * *'
  # 支援在 GitHub Actions 介面手動點擊「Run workflow」立即觸發
  workflow_dispatch:

# 避免前一次爬蟲尚未完成時重複啟動，保留正在執行的工作。
concurrency:
  group: daily-insurance-crawler
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 3.10 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝規則引擎與公開頁爬蟲套件
        run: pip install -r requirements.txt

      - name: 執行規則引擎測試 (Unit Tests)
        run: |
          python -m unittest discover -v

      - name: 匯出已同步的現售主目錄 (Export Active Master Catalog)
        run: |
          python merge_tii_catalog.py
          python catalog_sync.py export-metadata
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("tii_insurance_data/all_products_metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not data:
              raise SystemExit("爬蟲沒有取得商品，停止流程並保留既有網站資料")
          data = [item for item in data
                  if item.get("sales_status") == "現售"
                  and (item.get("discontinued_date") or "") in ("", "未停售")]
          if not data:
              raise SystemExit("沒有明確現售商品，停止流程並保留既有網站資料")
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          expected = {"國泰人壽", "南山人壽", "富邦人壽", "中華郵政壽險"}
          actual = {item.get("company_name") for item in data}
          missing = expected - actual
          if missing:
              raise SystemExit(f"目標公司資料不完整，缺少：{', '.join(sorted(missing))}")
          print(f"驗證通過：{len(data)} 筆原始商品，四家目標公司全部出現")
          PY

      - name: 執行免 API 規則引擎分類與標籤萃取 (Rule-based Classification)
        run: |
          python batch_extract.py

      - name: 更新前端卡片盒資料檔 (Update Frontend Data)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("tii_insurance_data/structured_products_final.json")
          target = Path("data/products.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          data = [item for item in data
                  if item.get("sales_status") == "現售"
                  and (item.get("discontinued_date") or "") in ("", "未停售")]
          if not data:
              raise SystemExit("分類結果為空，停止流程並保留既有網站資料")
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"驗證通過：{len(data)} 張前端卡片")
          PY

      - name: 準備 GitHub Pages 網站檔案 (Prepare Pages Artifact)
        run: |
          mkdir -p site
          cp index.html site/index.html
          mkdir -p site/data
          cp ./data/products.json site/data/products.json

      - name: 設定 GitHub Pages (Configure Pages)
        uses: actions/configure-pages@v5

      - name: 上傳 Pages Artifact (Upload Pages Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署至 GitHub Pages (Deploy Pages)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 自動提交與推送新商品資料 (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/products.json ] && git add data/products.json || true
          [ -f tii_insurance_data/all_products_metadata.json ] && git add tii_insurance_data/all_products_metadata.json || true
          if git diff --staged --quiet; then
            echo "沒有新上架商品，跳過提交。"
          else
            git commit -m "chore(auto-update): 自動收錄與分類最新壽險商品資料 [skip ci]"
            git push
          fi
