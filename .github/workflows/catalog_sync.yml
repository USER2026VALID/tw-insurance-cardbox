name: Official Four-Company Catalog Sync

on:
  schedule:
    # 官方商品目錄低頻檢查：每週一 UTC 19:00
    - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync official catalogs
        run: python catalog_lifecycle.py sync

      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('catalog/catalog.json').read_text(encoding='utf-8'))
          if not data:
              raise SystemExit('catalog is empty; refusing to commit')
          expected = {'國泰人壽', '南山人壽', '富邦人壽', '中華郵政壽險'}
          actual = {item.get('company_name') for item in data}
          print(f'catalog records: {len(data)}; companies: {sorted(actual)}')
          if not actual & expected:
              raise SystemExit('no target-company records discovered')
          diff = json.loads(Path('catalog/latest_diff.json').read_text(encoding='utf-8'))
          print(f"new={len(diff['new'])}; returned={len(diff['returned'])}; suspected_missing={len(diff['suspected_missing'])}; TII queue={len(diff['tii_queue'])}")
          PY

      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A catalog/
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore: refresh official four-company catalog [skip ci]'
            git push
          fi
